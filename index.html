<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with the HTML CSS and Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-div">
        <div class="inner-div">
            <h2 class="question">Question here comes</h2>
            <ul>
                <li>
                    <input type="radio" name="answer" id="ans1" class="answer" value="ans1"> 
                    <label for="ans1" id="option1">Answer Option</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="ans2" class="answer" value="ans2"> 
                    <label for="ans2" id="option2">Answer Option</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="ans3" class="answer" value="ans3"> 
                    <label for="ans3" id="option3">Answer Option</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="ans4" class="answer" value="ans4"> 
                    <label for="ans4" id="option4">Answer Option</label>
                </li>
            </ul>
            <button id="submit">Submit</button>
            <div class="scoreArea" id="showScore"></div>
        </div>
    </div>
    
    
    <script src="script.js" ></script>
</body>
</html>
